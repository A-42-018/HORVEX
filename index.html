<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <!-- Performance (roadmap §13): the first API call and the hero image start sooner; the display font (headlines) is preloaded. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/cormorant-garamond/files/cormorant-garamond-latin-wght-normal.woff2" />
    <!-- seo:start (defaults for crawlers without JS; scripts/prerender.mjs writes per-page tags here, src/main.jsx removes them before React renders its own) -->
    <title data-seo>WRISTORY — Premium Watches</title>
    <meta data-seo name="description" content="WRISTORY — premium wristwatches for men and women. Cash on delivery across Bangladesh." />
    <meta data-seo property="og:site_name" content="WRISTORY" />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:title" content="WRISTORY — Premium Watches" />
    <meta data-seo property="og:description" content="WRISTORY — premium wristwatches for men and women. Cash on delivery across Bangladesh." />
    <meta data-seo name="twitter:card" content="summary" />
    <!-- seo:end -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
